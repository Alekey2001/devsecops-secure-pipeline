name: Test Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Debug start
        run: echo "Pipeline is running"

      - name: Node version
        run: node -v || echo "Node not installed"

      - name: NPM version
        run: npm -v || echo "NPM not installed"